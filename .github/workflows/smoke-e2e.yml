name: QA smoke E2E

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  smoke-e2e:
    name: qa-smoke-e2e (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run QA gates (single entrypoint)
        run: npm run qa
