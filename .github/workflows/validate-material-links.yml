name: Validate material links

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-material-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate material links
        run: node scripts/validate-material-links.js
