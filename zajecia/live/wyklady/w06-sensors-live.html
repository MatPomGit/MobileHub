<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W6 – Sensory i kontekst (live)</title>
  <link rel="stylesheet" href="../vendor/reveal.js/dist/reveal.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css'">
  <link rel="stylesheet" href="../vendor/reveal.js/dist/theme/black.css" id="theme-link" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css'">
  <link rel="stylesheet" href="live-theme.css">
</head>
<body>
  <div class="reveal">
    <div class="slides lecture-template" data-lecture-template="pdf-sync" data-pdf-src="../../wyklady/pam_w06_sensors.pdf">
      <section class="slide-cover" data-section="otwarcie">
        <h1>W6 – Sensory i kontekst</h1>
        <p class="lecture-meta">Wersja live zsynchronizowana 1:1 z PDF: pam_w06_sensors.pdf</p>
        <p>Każdy kolejny slajd jest renderowany bezpośrednio z odpowiadającej strony PDF.</p>
      </section>
      <section class="slide-block" data-loading-slide>
        <h2>Ładowanie slajdów PDF…</h2>
        <p>Jeśli ładowanie trwa długo, odśwież stronę lub sprawdź połączenie sieciowe.</p>
      </section>
    </div>
  </div>

  <script src="../vendor/reveal.js/dist/reveal.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js'"></script>
  <script src="../vendor/reveal.js/plugin/notes/notes.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js'"></script>
  <script src="live-reveal-enhancements.js"></script>
  <script type="module">
    // Renderuje każdą stronę PDF jako osobny slajd Reveal.js, zapewniając zgodność treści 1:1.
    async function renderPdfSlides() {
      const slidesRoot = document.querySelector('.slides[data-pdf-src]');
      if (!slidesRoot) return;

      const pdfSrc = slidesRoot.dataset.pdfSrc;
      const loadingSlide = slidesRoot.querySelector('[data-loading-slide]');

      // Ładujemy PDF.js z kilku CDN-ów, aby wykłady działały nawet przy częściowych awariach sieci.
      const pdfJsSources = [
        {
          moduleUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs',
          workerUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs',
        },
        {
          moduleUrl: 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.mjs',
          workerUrl: 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs',
        },
      ];

      let pdfjsModule = null;
      let lastImportError = null;
      for (const source of pdfJsSources) {
        try {
          pdfjsModule = await import(source.moduleUrl);
          pdfjsModule.GlobalWorkerOptions.workerSrc = source.workerUrl;
          break;
        } catch (importError) {
          lastImportError = importError;
          console.warn('Nie udało się załadować PDF.js z:', source.moduleUrl, importError);
        }
      }

      if (!pdfjsModule) {
        const fallbackMessage = lastImportError?.message || 'Nie udało się pobrać modułu PDF.js.';
        if (loadingSlide) {
          loadingSlide.innerHTML = '<h2>Brak dostępu do silnika PDF</h2>'
            + '<p>' + fallbackMessage + '</p>'
            + '<p>Użyj przycisku „Otwórz PDF” lub sprawdź połączenie z internetem.</p>'
            + '<p><a href="' + pdfSrc + '" target="_blank" rel="noopener">Otwórz PDF</a></p>';
        }
        return;
      }

      let pdf;
      try {
        pdf = await pdfjsModule.getDocument(pdfSrc).promise;
      } catch (err) {
        console.error('Błąd ładowania PDF:', err);
        if (loadingSlide) loadingSlide.innerHTML = '<h2>Błąd ładowania</h2><p>' + err.message + '</p>';
        return;
      }

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 1 });

        // Dobór skali do proporcji slajdu, aby tekst pozostał czytelny.
        const maxWidth = 1280;
        const maxHeight = 720;
        const scale = Math.min(maxWidth / viewport.width, maxHeight / viewport.height);
        const scaledViewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: false });
        canvas.width = Math.floor(scaledViewport.width);
        canvas.height = Math.floor(scaledViewport.height);
        canvas.className = 'pdf-page-canvas';

        await page.render({ canvasContext: context, viewport: scaledViewport }).promise;

        const section = document.createElement('section');
        section.className = 'slide-block pdf-slide';
        section.dataset.section = 'pdf-page';

        const title = document.createElement('h2');
        title.textContent = 'Slajd ' + pageNumber;

        const notes = document.createElement('aside');
        notes.className = 'notes';
        notes.textContent = 'Notatki: omów kluczowe punkty ze slajdu ' + pageNumber + ' i podaj przykład praktyczny.';

        const wrapper = document.createElement('div');
        wrapper.className = 'pdf-slide-wrapper';
        wrapper.appendChild(canvas);

        section.appendChild(title);
        section.appendChild(notes);
        section.appendChild(wrapper);
        slidesRoot.appendChild(section);
      }

      if (loadingSlide) {
        loadingSlide.remove();
      }

      if (window.Reveal?.sync) {
        window.Reveal.sync();
      }
    }

    // Inicjalizuje Reveal.js po zakończeniu renderowania slajdów z PDF.
    async function initializeLecture() {
      await renderPdfSlides();
      initializeLiveReveal({
        transition: 'slide',
        backgroundTransition: 'fade',
        autoAnimate: false,
        presenterNotesEnabled: true,
      });
    }

    initializeLecture();
  </script>
</body>
</html>
